; Fish Tank + Deer Hunt combo. One board holds BOTH apps in its two app slots (ota_0 = Fish Tank, ota_1 = Deer Hunt) and
; switches between them from the web page or the BOOT button. There is no OTA: every flash is a USB flash of the merged image.
; Build one app for one board with `pio run -e fish-freenove28`, or everything with tools/build_all.sh (which also merges the
; images). Env names are <app>-<board>: app is fish or deer, board is freenove4, freenove28, cyd28 or cyd28usb2.
[platformio]
src_dir = apps
boards_dir = boards
default_envs = fish-freenove28

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib_freenove
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
    ; On-device WiFi picker (LVGL is only used until the board is online)
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git#1.6.8
    lvgl/lvgl@8.4.0
build_flags =
    -O2
    -I include
    -I apps/common
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

[board_freenove4]
board = ESP32-S3-WROOM-1-N16R8
board_build.partitions = partitions_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7796_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=80000000
    -DUSE_HSPI_PORT=1

[board_freenove28]
board = ESP32-S3-WROOM-1-N16R8
board_build.partitions = partitions_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_FREENOVE28
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000

[board_cyd28]
board = esp32dev
board_build.partitions = partitions_4MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_CYD28
    -DILI9341_2_DRIVER
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT

[board_cyd28usb2]
board = esp32dev
board_build.partitions = partitions_4MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_CYD28
    -DST7789_DRIVER
    -DTFT_INVERSION_OFF
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT

[env:fish-freenove4]
board = ${board_freenove4.board}
board_build.partitions = ${board_freenove4.board_build.partitions}
board_build.embed_files =
    apps/fishtank/bubbles.raw
    apps/fishtank/feed.raw
    apps/fishtank/favicon.ico
build_src_filter = -<*> +<common/> +<fishtank/>
build_flags =
    ${board_freenove4.build_flags}
    -DCOMBO_APP_FISH

[env:fish-freenove28]
